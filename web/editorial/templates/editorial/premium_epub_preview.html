<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium EPUB Preview · {{ edition.title }}</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #ece8df; color: #24211d; }
    header { padding: 1rem 1.25rem; background: #fff; border-bottom: 1px solid #cfc8bc; }
    header h1 { margin: 0 0 .4rem; font-size: 1.2rem; }
    .layout { display: grid; grid-template-columns: minmax(13rem, 20rem) 1fr; min-height: calc(100vh - 5rem); }
    nav { padding: 1rem; overflow: auto; background: #f8f5ef; }
    nav a { display: block; padding: .35rem .5rem; color: inherit; text-decoration: none; border-radius: .25rem; }
    nav a:hover { background: #e5ded2; }
    main { padding: 1rem; }
    iframe { display: block; width: min(48rem, 100%); height: calc(100vh - 8rem); margin: auto; border: 1px solid #aaa; background: #fff; }
    .badge { display: inline-block; padding: .2rem .5rem; border-radius: 999px; background: #ded8cc; }
    button { padding: .55rem .8rem; cursor: pointer; }
    @media (max-width: 48rem) { .layout { grid-template-columns: 1fr; } nav { max-height: 12rem; } }
  </style>
</head>
<body>
  <header>
    <h1>{{ edition.work.code }} · {{ edition.title }} [{{ edition.language.code }}]</h1>
    <span class="badge">{{ render_state.status }}</span>
    <span class="badge">tema {{ manifest.theme }}</span>
    <span class="badge">hash {{ render_result.fingerprint|slice:":12" }}</span>
    <form method="post" action="{% url 'premium_epub_approve' edition.id %}" style="display:inline">
      {% csrf_token %}
      <button type="submit">Aprovar este preview</button>
    </form>
    <a href="{% url 'edition_steps' edition.id %}">Voltar ao pipeline</a>
  </header>
  <div class="layout">
    <nav aria-label="Páginas do EPUB">
      {% for page in pages %}
      <a href="{% url 'premium_epub_asset' edition.id 'EPUB/text/'|add:page %}" target="epub-preview">{{ page }}</a>
      {% endfor %}
    </nav>
    <main>
      <iframe name="epub-preview" title="Preview EPUB" src="{% url 'premium_epub_asset' edition.id 'EPUB/text/'|add:first_page %}"></iframe>
    </main>
  </div>
</body>
</html>

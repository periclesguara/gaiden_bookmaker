<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cadastro Geral{% endblock %}</title>
  <style>
    body{margin:0;background:#f4f1ec;color:#20282b;font-family:system-ui,sans-serif}header,main{width:min(1120px,calc(100% - 32px));margin:auto}header{display:flex;justify-content:space-between;padding:24px 0}a{color:#85351f}main{background:#fff;padding:28px;border-radius:10px;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.button,button{display:inline-block;padding:10px 14px;border:0;border-radius:6px;background:#85351f;color:#fff;text-decoration:none}label{display:block;font-weight:700;margin-top:12px}input,select{width:100%;padding:9px;box-sizing:border-box}.muted{color:#667074}.error{color:#a12622}
  </style>
</head>
<body>
<header><strong><a href="{% url 'intake_module:batch_list' %}">Cadastro Geral</a></strong><a href="/">Gaiden</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>

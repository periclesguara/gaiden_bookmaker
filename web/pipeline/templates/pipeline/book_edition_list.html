<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Editions - Gaiden</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    h1 { margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
    th { background: #f2f2f2; text-align: left; }
    a.btn { display: inline-block; padding: 6px 10px; border-radius: 4px; border: 1px solid #444; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Book Editions</h1>

  <p>
    <a href="{% url 'pipeline_jobs' %}" class="btn">Ver pipelines</a>
    <a href="{% url 'book_edition_new' %}" class="btn">Nova edição</a>
  </p>

  <table>
    <thead>
      <tr>
        <th>Book code</th>
        <th>Language</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Seal</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for ed in editions %}
      <tr>
        <td>{{ ed.work.code }}</td>
        <td>{{ ed.language.code }}</td>
        <td>{{ ed.work.title }}</td>
        <td>{{ ed.work.author.name }}</td>
        <td>{{ ed.work.year }}</td>
        <td>{{ ed.seal.name }}</td>
        <td>
          <a href="{% url 'edition_steps' edition_id=ed.id %}">Pipeline steps</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="7">No editions yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>

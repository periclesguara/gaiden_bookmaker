<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nova edição - Gaiden</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input, select { width: 100%; padding: 8px; font-size: 14px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .actions { margin-top: 16px; }
    button { padding: 8px 12px; font-size: 14px; }
    .nav { display: flex; gap: 10px; margin-bottom: 14px; font-size: 13px; }
    .nav a { text-decoration: none; border-bottom: 1px solid transparent; }
    .nav a:hover { border-bottom-color: #444; }
    .banner { padding: 10px 12px; border: 1px solid #f0c36d; background: #fff7df; border-radius: 6px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/pipeline/projects/">Projects</a>
    <a href="/pipeline/runner/">Runner</a>
    <a href="/pipeline/dashboard/">Dashboard</a>
    <a href="/pipeline/editions/">Editions</a>
  </nav>

  <h1>Editar edição (Advanced)</h1>
  <div class="banner">
    Cadastro oficial de livros é em Projects. Esta tela (Edições) é avançada, para ajustes finos por idioma.
    <div style="margin-top: 10px;">
      <a href="/pipeline/projects/" class="btn">Ir para Projects</a>
      <a href="/pipeline/projects/new/" class="btn">Criar novo Project</a>
    </div>
  </div>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Book code</label>
    <input type="text" name="book_code" value="{{ work.code }}" readonly required />

    <label>Idioma</label>
    <input type="text" name="language" value="{{ edition.language.code }}" readonly required />

    <div class="row">
      <div>
        <label>Título</label>
        <input type="text" name="title" value="{{ edition.title|default_if_none:'' }}" />
      </div>
      <div>
        <label>Autor</label>
        <input type="text" name="author" value="{{ edition.author|default_if_none:'' }}" />
      </div>
      <div>
        <label>Ano</label>
        <input type="text" name="year" value="{{ edition.edition_year|default_if_none:'' }}" />
      </div>
    </div>

    <label>Selo</label>
    <select name="seal">
      {% for s in seals %}
      <option value="{{ s.slug }}" {% if edition.seal.slug == s.slug %}selected{% endif %}>{{ s.name }}</option>
      {% endfor %}
    </select>

    <div class="actions">
      <button type="submit">Salvar edição</button>
    </div>
  </form>
</body>
</html>

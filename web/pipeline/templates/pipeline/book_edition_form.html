<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nova edição - Gaiden</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input, select { width: 100%; padding: 8px; font-size: 14px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .actions { margin-top: 16px; }
    button { padding: 8px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Nova edição</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Book code</label>
    <input type="text" name="book_code" placeholder="book_0002" required />

    <label>Idioma</label>
    <select name="language" required>
      {% for lang in languages %}
      <option value="{{ lang.code }}">{{ lang.native_name }} ({{ lang.code }})</option>
      {% endfor %}
    </select>

    <div class="row">
      <div>
        <label>Título</label>
        <input type="text" name="title" />
      </div>
      <div>
        <label>Autor</label>
        <input type="text" name="author" />
      </div>
      <div>
        <label>Ano</label>
        <input type="text" name="year" />
      </div>
    </div>

    <label>Selo</label>
    <select name="seal">
      {% for s in seals %}
      <option value="{{ s.slug }}">{{ s.name }}</option>
      {% endfor %}
    </select>

    <label>RAW (opcional)</label>
    <input type="file" name="raw_file" />

    <div class="actions">
      <button type="submit">Criar edição</button>
    </div>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Markdown Preview - {{ book_code }} ({{ language }})</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 20px;
    }
    h1 {
      margin-bottom: 8px;
    }
    .meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
      background: #f9f9f9;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .actions {
      margin-bottom: 16px;
    }
    .actions a {
      margin-right: 12px;
      font-size: 14px;
      text-decoration: none;
      color: #0070f3;
    }
  </style>
</head>
<body>
  <h1>Markdown Preview</h1>
  <div class="meta">
    <strong>Book:</strong> {{ book_code }} |
    <strong>Language:</strong> {{ language }} |
    <strong>File:</strong> {{ md_path }}
  </div>

  <div class="actions">
    <a href="{% url 'book_edition_list' %}">Back to Editions</a>
    <a href="{% url 'book_edition_edit' book_code=book_code language=language %}">Edit this Edition</a>
  </div>

  <pre>{{ content }}</pre>
</body>
</html>

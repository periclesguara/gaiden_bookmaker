<style>
  .workspace-nav {
    margin: 0 0 18px;
  }
  .workspace-nav-track {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid rgba(103, 84, 63, 0.18);
    background: linear-gradient(180deg, rgba(255, 252, 247, 0.96), rgba(242, 234, 223, 0.96));
    box-shadow: 0 10px 28px rgba(44, 31, 20, 0.08);
  }
  .workspace-nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 124px;
    padding: 9px 14px;
    border-radius: 11px;
    border: 1px solid rgba(103, 84, 63, 0.22);
    background: linear-gradient(180deg, #fffefb, #efe4d6);
    color: #201910;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .workspace-nav-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(44, 31, 20, 0.09);
  }
  .workspace-nav-btn.active {
    border-color: #b44e2f;
    background: linear-gradient(180deg, #d95f38, #b54828);
    color: #fffdf9;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 10px 20px rgba(180, 78, 47, 0.24);
  }
  .workspace-nav-btn.disabled {
    border-style: dashed;
    background: linear-gradient(180deg, #f6f1ea, #ece3d8);
    color: #8b7f72;
    cursor: not-allowed;
    pointer-events: none;
    box-shadow: none;
  }
</style>
<nav class="workspace-nav" aria-label="Navegacao do fluxo">
  <div class="workspace-nav-track">
    {% if nav_home_url %}
      <a class="workspace-nav-btn{% if nav_active == 'home' %} active{% endif %}" href="{{ nav_home_url }}">Inicio / Cadastro</a>
    {% else %}
      <span class="workspace-nav-btn disabled">Inicio / Cadastro</span>
    {% endif %}

    {% if nav_pipeline_url %}
      <a class="workspace-nav-btn{% if nav_active == 'pipeline' %} active{% endif %}" href="{{ nav_pipeline_url }}">Pipeline</a>
    {% else %}
      <span class="workspace-nav-btn disabled">Pipeline</span>
    {% endif %}

    {% if nav_steps_url %}
      <a class="workspace-nav-btn{% if nav_active == 'steps' %} active{% endif %}" href="{{ nav_steps_url }}">Steps</a>
    {% else %}
      <span class="workspace-nav-btn disabled">Steps</span>
    {% endif %}

    {% if nav_frontmatter_url %}
      <a class="workspace-nav-btn{% if nav_active == 'frontmatter' %} active{% endif %}" href="{{ nav_frontmatter_url }}">Frontmatter</a>
    {% else %}
      <span class="workspace-nav-btn disabled">Frontmatter</span>
    {% endif %}
  </div>
</nav>

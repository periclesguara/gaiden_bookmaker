[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiden-bookmaker"
version = "0.1.0"
description = "Gaiden BookMaker"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.5",
]

[project.scripts]
gaiden-cli = "gaiden.interfaces.cli:main"
gaiden-collections = "gaiden.interfaces.collections_cli:main"

[tool.setuptools.packages.find]
include = ["gaiden*"]

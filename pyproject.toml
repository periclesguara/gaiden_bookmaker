[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiden-bookmaker"
version = "0.1.0"
description = "Private editorial production platform for RinoBooks"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.17",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "markitdown[all]==0.1.7",
    "openai==3.3.1",
    "pgvector==0.5.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.12",
    "requests==2.34.2",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
audit = [
    "pip-audit==2.10.1",
]

[tool.setuptools]
packages = ["gaiden", "gaiden.writer_engine"]

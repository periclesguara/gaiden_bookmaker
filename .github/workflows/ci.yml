name: Main CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gaiden
          POSTGRES_USER: gaiden
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaiden -d gaiden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-gaiden-secret
      WRITER_DJANGO_SECRET_KEY: ci-only-writer-secret
      DJANGO_DEBUG: "0"
      WRITER_DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      WRITER_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: gaiden
      PGUSER: gaiden
      PGPASSWORD: ci-only-password
      WRITER_PGDATABASE: gaiden
      WRITER_PGUSER: gaiden
      WRITER_PGPASSWORD: ci-only-password
      WRITER_PGHOST: 127.0.0.1
      WRITER_PGPORT: 5432
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .
      - name: Prepare PostgreSQL and pgvector
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -v ON_ERROR_STOP=1 -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Validate Gaiden migrations
        run: |
          python web/manage.py check
          python web/manage.py makemigrations --check --dry-run
          python web/manage.py migrate --plan
          python web/manage.py migrate --noinput
          python web/manage.py migrate --check
      - name: Validate Writer migrations without changing app identity
        run: |
          python writer_web/manage.py check
          python writer_web/manage.py makemigrations --check --dry-run
          python writer_web/manage.py migrate --plan
          python writer_web/manage.py migrate --noinput
          python writer_web/manage.py migrate --check
      - name: Compile source
        run: python -m compileall -q gaiden writer_engine web writer_web scripts
      - name: Require a meaningful combined Django test baseline
        run: |
          gaiden_tests=$(python web/manage.py shell -c 'from django.test.runner import DiscoverRunner; print(DiscoverRunner(verbosity=0).build_suite(["editorial","pipeline"]).countTestCases())' | tail -n 1)
          writer_tests=$(python writer_web/manage.py shell -c 'from django.test.runner import DiscoverRunner; print(DiscoverRunner(verbosity=0).build_suite(["writer"]).countTestCases())' | tail -n 1)
          total_tests=$((gaiden_tests + writer_tests))
          echo "Discovered ${total_tests} Django tests (${gaiden_tests} Gaiden + ${writer_tests} Writer)"
          test "${total_tests}" -ge 20
      - name: Run Gaiden tests
        run: python web/manage.py test editorial pipeline --noinput --verbosity 2
      - name: Run Writer tests
        run: python writer_web/manage.py test writer --noinput --verbosity 2
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-ci.txt --progress-spinner=off

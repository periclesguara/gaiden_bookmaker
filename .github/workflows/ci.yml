name: Main CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gaiden
          POSTGRES_USER: gaiden
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaiden -d gaiden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SECRET_KEY: ci-only-django-secret-not-used-outside-actions
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: gaiden
      PGUSER: gaiden
      PGPASSWORD: ci-only-password
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Prepare PostgreSQL and pgvector
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -v ON_ERROR_STOP=1 -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"

      - name: Validate Django and migrations
        run: |
          python web/manage.py check
          python web/manage.py makemigrations --check --dry-run
          python web/manage.py migrate --plan
          python web/manage.py migrate --noinput
          python web/manage.py migrate --check

      - name: Compile source
        run: python -m compileall -q gaiden web scripts

      - name: Require a meaningful Django test baseline
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "web")
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "gaiden_portal.settings")

          import django
          django.setup()

          from django.test.runner import DiscoverRunner

          suite = DiscoverRunner(verbosity=0).build_suite(["editorial", "pipeline", "writer"])
          count = suite.countTestCases()
          print(f"Discovered {count} Django tests")
          if count < 20:
              raise SystemExit("Django test baseline fell below 20 tests")
          PY

      - name: Run tests
        run: python web/manage.py test editorial pipeline writer --noinput --verbosity 2

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-ci.txt --progress-spinner=off

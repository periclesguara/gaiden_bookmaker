name: Gaiden CI

on:
  pull_request:
  push:
    branches: [main, agent/gaiden-author-studio]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: gaiden_ci
          POSTGRES_USER: gaiden_ci
          POSTGRES_PASSWORD: gaiden_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaiden_ci -d gaiden_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: gaiden_ci
      PGUSER: gaiden_ci
      PGPASSWORD: gaiden_ci
      GAIDEN_DB_FINGERPRINT: postgres://gaiden_ci@127.0.0.1:5432/gaiden_ci
      GAIDEN_STORAGE_ROOT: ${{ runner.temp }}/gaiden-data
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Reject tracked secrets and runtime artifacts
        run: bash scripts/ci/check_repo_hygiene.sh
      - name: Scan current tracked content
        run: python scripts/ci/scan_tracked_secrets.py
      - name: Django system check
        run: python web/manage.py check
      - name: Check migrations
        run: python web/manage.py makemigrations --check --dry-run
      - name: Block 00, Drive, promotion, and home regressions
        run: python web/manage.py test intake_module --verbosity 1
      - name: Full pipeline regression suite
        run: python web/manage.py test pipeline editorial collections_module --verbosity 1

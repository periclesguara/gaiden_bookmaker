name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject tracked secrets and runtime artifacts
        run: bash scripts/ci/check_repo_hygiene.sh

  secret-scan-current-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files without exposing matched values
        run: python3 scripts/ci/scan_tracked_secrets.py
      - name: Compile security tooling
        run: python3 -m py_compile scripts/ci/scan_tracked_secrets.py

  source-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Python source
        run: python3 -m compileall -q gaiden web scripts
      - name: Validate shell scripts
        run: |
          bash -n scripts/ci/check_repo_hygiene.sh
          bash -n scripts/ops/env_gaiden.sh

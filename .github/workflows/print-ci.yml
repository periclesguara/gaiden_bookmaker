name: Print Engine CI

on:
  pull_request:
    paths:
      - "gaiden/print_engine/**"
      - "tests/test_print_engine*.py"
      - "docs/print-engine.md"
      - "pyproject.toml"
      - ".github/workflows/print-ci.yml"
  push:
    branches: [main]
    paths:
      - "gaiden/print_engine/**"
      - "tests/test_print_engine*.py"
      - "docs/print-engine.md"
      - "pyproject.toml"
      - ".github/workflows/print-ci.yml"

permissions:
  contents: read

concurrency:
  group: print-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  print-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-print-ci.txt

      - name: Install print toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-print-ci.txt
          python -m pip install --no-deps -e .
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-fonts-recommended texlive-latex-extra texlive-luatex

      - name: Verify isolated print contracts
        run: python -m pytest -q tests/test_print_engine.py tests/test_print_engine_cli.py

      - name: Compile a real final interior
        run: |
          mkdir -p "${RUNNER_TEMP}/gaiden-print"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "gaiden-print"
          payload = {
              "title": "Gaiden Print CI",
              "author": "RinoBooks",
              "chapters": [{"title": "Chapter 1", "body": "Print contract smoke test."}],
          }
          (root / "book.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          python -m gaiden.print_engine build-interior \
            --input "${RUNNER_TEMP}/gaiden-print/book.json" \
            --output-dir "${RUNNER_TEMP}/gaiden-print/output"
          page_count="$(pdfinfo "${RUNNER_TEMP}/gaiden-print/output/INTERIOR.pdf" | awk '/^Pages:/ {print $2}')"
          test "${page_count}" -gt 0
          test "$((page_count % 2))" -eq 0
